<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suhasini Pillay — Data &amp; Business Systems Analyst</title>
  <meta name="description" content="Portfolio of Suhasini Pillay, data and business systems analyst: SQL, Power BI, Tableau, Python and ITSM analytics case studies.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Cpath d='M8 22V14M14 22V9M20 22v-6M26 22V11' stroke='%235eead4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- FONTS: change the families here and in css/config.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Hide the empty shell for a moment while js/render.js fills it (prevents a layout jump).
       Without JavaScript this never runs, so nothing is hidden. -->
  <script>document.documentElement.classList.add("js-loading");setTimeout(function(){document.documentElement.classList.remove("js-loading")},3000);</script>
  <link rel="stylesheet" href="css/config.css?v=2">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="css/motion.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript><p class="noscript">This portfolio needs JavaScript to load its content. Email: pillaysuhasini346@gmail.com</p></noscript>

  <!-- Scroll progress -->
  <div class="progress" aria-hidden="true"><div class="progress__bar"></div></div>

  <!-- Navigation -->
  <header class="nav" id="nav">
    <div class="nav__inner container">
      <a class="nav__logo" href="#top" data-bind="nav.logo"></a>
      <nav aria-label="Primary">
        <ul class="nav__links" id="nav-links"></ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- 1. HERO -->
    <section class="hero" id="top" aria-labelledby="hero-name">
      <canvas class="hero__canvas" aria-hidden="true"></canvas>
      <div class="hero__grid" aria-hidden="true"></div>
      <div class="hero__content container">
        <p class="eyebrow" data-bind="hero.eyebrow"></p>
        <h1 class="hero__name" id="hero-name" data-bind="hero.name"></h1>
        <p class="hero__role" data-bind="hero.role"></p>
        <p class="hero__headline" id="hero-headline"></p>
      </div>
      <a class="scroll-cue" href="#about">
        <span data-bind="hero.scrollCue"></span>
        <span class="scroll-cue__line" aria-hidden="true"></span>
      </a>
    </section>

    <!-- 2. ABOUT / STORY -->
    <section class="about section" id="about" aria-labelledby="about-label">
      <div class="about__pin">
        <div class="container about__grid">
          <div class="about__story">
            <p class="section-label" id="about-label" data-bind="about.label"></p>
            <ol class="story" id="story"></ol>
          </div>
          <figure class="portrait" id="portrait"></figure>
        </div>
      </div>
      <div class="container">
        <dl class="stats" id="stats"></dl>
      </div>
    </section>

    <!-- 3. SKILLS -->
    <section class="skills section" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <p class="section-label" data-bind="skills.label"></p>
        <h2 class="section-title" id="skills-title" data-bind="skills.title"></h2>
        <ul class="skills__grid" id="skills-grid"></ul>
      </div>
    </section>

    <!-- 4. PROJECTS -->
    <section class="projects section" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <p class="section-label" data-bind="projects.label"></p>
        <h2 class="section-title" id="projects-title" data-bind="projects.title"></h2>
        <p class="section-intro" data-bind="projects.intro"></p>
      </div>
      <div id="cases"></div>

      <div class="gallery" aria-label="Project screenshots">
        <div class="gallery__track" id="gallery"></div>
      </div>
    </section>

    <!-- 4b. GITHUB (live) — removed entirely if the fetch fails -->
    <section class="github section" id="github" aria-labelledby="github-title" aria-busy="true">
      <div class="container">
        <p class="section-label" data-bind="github.label"></p>
        <h2 class="section-title" id="github-title" data-bind="github.title"></h2>
        <p class="section-intro" data-bind="github.intro"></p>
        <ul class="repos" id="repos"></ul>
        <a class="btn btn--ghost github__more" id="github-profile" href="#">All repositories on GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <!-- 5. PROCESS -->
    <section class="process section" id="process" aria-labelledby="process-title">
      <div class="container">
        <p class="section-label" data-bind="process.label"></p>
        <h2 class="section-title" id="process-title" data-bind="process.title"></h2>
        <div class="pipeline">
          <ol class="pipeline__stages" id="pipeline"></ol>
        </div>
      </div>
    </section>

    <!-- 6. EXPERIENCE -->
    <section class="experience section" id="experience" aria-labelledby="experience-title">
      <div class="container">
        <p class="section-label" data-bind="experience.label"></p>
        <h2 class="section-title" id="experience-title" data-bind="experience.title"></h2>
        <div class="timeline">
          <div class="timeline__track" aria-hidden="true"><div class="timeline__fill"></div></div>
          <ol class="timeline__list" id="timeline"></ol>
        </div>
      </div>
    </section>

    <!-- 7. CONTACT -->
    <section class="contact section" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <p class="section-label" data-bind="contact.label"></p>
        <h2 class="contact__headline" id="contact-title"></h2>
        <p class="contact__text" data-bind="contact.text"></p>
        <div class="contact__actions">
          <a class="btn btn--primary magnetic" id="contact-email" href="#"><span>Email me</span></a>
          <a class="btn btn--ghost magnetic" id="contact-linkedin" href="#" rel="noopener"><span>LinkedIn</span></a>
          <a class="btn btn--ghost magnetic" id="contact-cv" href="#" download><span>Download CV</span></a>
        </div>
        <p class="contact__address" id="contact-address"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p data-bind="footer.text"></p>
      <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </div>
  </footer>

  <!-- Content → page.
       After changing a file, bump its ?v= number (v=2 → v=3) so browsers load the new copy. -->
  <script src="js/data.js?v=3"></script>
  <script src="js/render.js?v=2"></script>
  <script src="js/github.js?v=2"></script>

  <!-- Motion (GSAP + ScrollTrigger + Lenis, bundled locally in js/vendor) -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/lenis.min.js"></script>
  <script src="js/animations.js?v=2"></script>
</body>
</html>
